<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="EW">
  <!-- The header's monogram tile, with the lime full stop from the titles.
       Colours are the fg, bg, and lime tokens from tokens.css, as sRGB.
       (No double hyphens in here: they are not allowed inside XML comments.) -->
  <style>
    .tile { fill: #121d19 }
    .mark { fill: #fafaf6; font: 600 24px ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace }
    .dot { fill: #c6f18a }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f3f5ec }
      .mark { fill: #121d19 }
      .dot { fill: #3c6511 }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="14" />
  <text class="mark" x="29" y="41" text-anchor="middle">EW</text>
  <circle class="dot" cx="52.5" cy="39" r="3.5" />
</svg>
